name: CI

# European CI for the HireSnap superproject.
#
# Mirror of R:\GPTHub\.github\workflows\ci.yml:1-19. The shape of that file is
# kept on purpose:
#   * checkout uses `submodules: recursive` with the stock GITHUB_TOKEN - backend
#     and frontend are branches of the same remote, so no PAT is needed
#     (R:\GPTHub\.github\workflows\ci.yml:3-8,28-32);
#   * one job per concern, and each job is BLOCKING. A step that cannot fail is
#     not a check (R:\GPTHub\.github\workflows\ci.yml:76-78);
#   * the guards that pre-commit runs are the SAME scripts CI runs, so there is
#     no second implementation to drift (R:\GPTHub\.github\workflows\ci.yml:502-505).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Manual run: useful when a runner image changes (docker, node) and someone
  # needs to re-check the stack without pushing a commit.
  workflow_dispatch:

# A newer push to the same ref makes the running build irrelevant; cancelling it
# frees a runner instead of queueing behind work nobody will read
# (R:\GPTHub\.github\workflows\ci.yml:16-18).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The three env files are resolved ONCE here. docker/.env.dev and .env.prod are
  # gitignored, so CI fabricates them from the only committed manifest, exactly as
  # R:\GPTHub\.github\workflows\ci.yml:512-513 does.
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ===========================================================================
  # 1. The superproject guards. These are the same scripts pre-commit calls, and
  #    they are the only checks that understand the CROSS-REPO contracts (gateway
  #    prefix, env manifest, health probes, pinned images, generated state).
  # ===========================================================================
  guards:
    name: Guards (scripts/check_*.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # WHY the env files are created before the guards: check_env_parity.py
      # compares the template against both deployment files, and a missing
      # deployment file is a SKIP, not a pass. On a runner the files never exist,
      # so without this step the strongest half of that guard would never run in
      # CI - the same reason GPTHub copies .env.example twice before validating
      # compose (R:\GPTHub\.github\workflows\ci.yml:512-513).
      - name: Fabricate the gitignored env files from the template
        run: |
          cp docker/.env.example docker/.env.dev
          cp docker/.env.example docker/.env.prod

      # `python -m py_compile` first, because a guard with a syntax error would
      # otherwise fail as "a guard failed" and hide which one is broken.
      - name: Guards compile
        run: python -m py_compile scripts/check_*.py

      # NOTE: NOT wrapped in `|| true` and NOT `continue-on-error`. Any guard that
      # exits non-zero fails the job. A guard that legitimately cannot run prints
      # [SKIP] with its reason and exits 0 - the distinction is in the output, not
      # in the exit code, so a skipped guard is visible in the log.
      # The loop picks up every scripts/check_*.py, so a NEW guard is in CI the
      # moment it is committed - including scripts/check_ml_boundary.py, the gate
      # that keeps torch and friends out of the API image. That is deliberate: a
      # per-file list here would let a guard exist and never run, which is the
      # "a check that cannot fail" failure mode with extra steps.
      - name: Run every guard
        run: |
          set -e
          for script in scripts/check_*.py; do
            echo "=== $script"
            python "$script"
          done

      # `config -q` is the only thing that proves a compose file is RESOLVABLE -
      # interpolation, profiles and merged keys - rather than merely valid YAML
      # (R:\GPTHub\.github\workflows\ci.yml:510-517). -q keeps the rendered
      # document, which contains every secret, out of the log.
      # NOTE: there is no --profile ml any more. The sidecar became a CORE
      # service (profiles prod/dev) when it moved into its own submodule, because
      # "the API cannot answer an upload without it" is the definition of core -
      # leaving it behind a profile meant the default stack came up with no
      # embedding path at all. scripts/check_compose_parity.py asserts this
      # (section 7), so a regression is caught here as well.
      - name: Validate both compose files
        run: |
          docker compose --env-file docker/.env.dev -f docker/docker-compose.dev.yaml \
            --profile dev --profile cache --profile storage \
            --profile celery --profile mail config -q
          docker compose --env-file docker/.env.prod -f docker/docker-compose.yaml \
            --profile prod --profile cache --profile storage \
            --profile celery --profile mail config -q

      # A submodule pointer that no longer resolves (force-pushed branch, missing
      # fetch) makes every later job fail with a confusing error; this step names
      # the cause (R:\GPTHub\.github\workflows\ci.yml:471-472).
      - name: Submodules resolved
        run: git submodule status

  # ===========================================================================
  # 2. Secret scanning over the WHOLE history, including submodules.
  # ===========================================================================
  secrets:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: the point is to find a secret that was added and then
          # "removed" by the next commit. A shallow clone cannot see it
          # (R:\GPTHub\.github\workflows\ci.yml:420-423).
          fetch-depth: 0

      # WHY the binary and not gitleaks/gitleaks-action@v2: the action requires a
      # paid GITLEAKS_LICENSE when used on an organisation repository and fails
      # with "missing gitleaks license" WITHOUT scanning anything - a red step
      # that protects nothing. The binary is MIT and needs no licence. The version
      # is PINNED because new releases ship new rules, and a floating version
      # would turn an upstream update into a red build
      # (R:\GPTHub\.github\workflows\ci.yml:424-438).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # `detect` scans history; `--redact` keeps the value out of the log while
      # still naming rule, file, line and commit - enough to fix or to justify one
      # precise exception in .gitleaks.toml.
      - name: Scan history for secrets
        run: |
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path /tmp/gitleaks-report.json --exit-code 1

      - name: Report findings without printing the secret
        if: failure()
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path('/tmp/gitleaks-report.json')
          if not path.is_file():
              raise SystemExit('no report written')
          for item in json.loads(path.read_text() or '[]'):
              print('gitleaks finding: rule={RuleID} file={File} line={StartLine} commit={Commit}'.format(**item))
          PY

  # ===========================================================================
  # 3. File hygiene and the local hooks - the same command a developer runs.
  # ===========================================================================
  lint:
    name: Pre-commit (all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ruff/mypy are installed here so the backend local hooks actually RUN in CI
      # instead of printing their SKIP line. Locally they may be absent; in CI they
      # must not be, otherwise the hook that is supposed to catch broken code is a
      # no-op where it matters most (R:\GPTHub\.github\workflows\ci.yml:41-51).
      - name: Install the tools the local hooks use
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pre-commit==4.3.0" "ruff==0.14.1" "mypy==1.13.0" "pytest==8.2.2"

      # npm ci for BOTH services, because the frontend hook skips without
      # node_modules and a skip in CI is a hole. `--prefix` keeps the working
      # directory unchanged for every other hook.
      - name: Install frontend dependencies
        run: |
          if [ -f frontend/package-lock.json ]; then
            npm ci --prefix frontend
          else
            echo "frontend/package-lock.json is absent; the eslint hook will report SKIP"
          fi

      # `env:` files are gitignored, so the compose-config hook would skip. Create
      # them, exactly as the guards job does, so the hook performs its real check.
      - name: Fabricate the gitignored env files
        run: |
          cp docker/.env.example docker/.env.dev
          cp docker/.env.example docker/.env.prod

      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  # ===========================================================================
  # 4. Backend - the service's own toolchain, in the interpreter the image uses.
  # ===========================================================================
  backend:
    name: Backend (syntax + fatal lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 3.9 is the runtime the Dockerfile targets, not "whatever is newest":
      # testing on a version that never runs in production hides exactly the
      # incompatibilities (walrus-in-3.7, tomllib-in-3.10) that matter
      # (R:\GPTHub\.github\workflows\ci.yml:217-222 makes this argument for the
      # sidecars' pinned runtimes).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # WHY requirements.txt IS installed here (it was not, before the refactor):
      # the old file carried the whole ML stack, so installing it on a runner
      # meant torch and CUDA wheels. The refactor moved inference to the ml
      # sidecar and requirements.txt is now GPU-free by construction - the file
      # says so in its own header, and installing it is the cheapest way to prove
      # that claim instead of trusting the comment. If a torch pin reappears,
      # this step gets slow and the regression is visible.
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      # A syntax error in a module nothing imports yet is still a broken commit,
      # and compileall catches it without importing anything.
      - name: Compile every module
        run: python -m compileall -q service

      # THE LAYOUT GUARD IS RUN FROM THE REPOSITORY ROOT, not from backend/:
      # the job's defaults.run working-directory is backend, so this step overrides
      # it explicitly. The guard is a PATH assertion ("does the tree still look like
      # this"), and a path assertion resolved against the wrong directory passes for
      # the wrong reason - the same defect as the \"ruff src\" step that linted a
      # directory which no longer existed and reported no files.
      #
      # WHY a guard that belongs to the submodule runs here at all: it is the only
      # thing that knows the vertical-slice convention, and CI is the last place a
      # wrong tree can be caught before it is merged. It is stdlib-only and needs
      # nothing installed, so it runs before the toolchain is set up and its failure
      # is never confused with a dependency problem.
      # WHY the absence is a visible SKIP rather than a silent pass: the file lives
      # in the backend gitlink, so a checkout made without submodules legitimately
      # does not have it. Saying so out loud keeps a missing guard from looking like
      # a satisfied contract (the guards job makes the same argument).
      - name: Backend layout guard
        working-directory: .
        run: |
          if [ ! -f backend/scripts/check_backend_layout.py ]; then
            echo "SKIP: backend/scripts/check_backend_layout.py is absent - the backend submodule was not checked out, so the layout is unverified, not satisfied"
            exit 0
          fi
          python backend/scripts/check_backend_layout.py

      # WHY a ratchet and not a limit: a plain ceiling would either be loose enough to
      # accept anything or red on the day it is switched on, and a gate that starts red
      # teaches people to pass --no-verify (the argument the ruff step above makes about
      # style debt). This one fails only on NEW debt or on debt that GREW past the value
      # recorded in backend/scripts/complexity_baseline.json, so the accepted level is a
      # file a reviewer sees in the diff instead of a number buried in the checker.
      # WHY it runs in the backend job and not in lint: it is a property of this tree,
      # it needs nothing installed (stdlib, ast only), and putting it here means it runs
      # before ruff is installed - so its failure can never be mistaken for a broken
      # toolchain. Same reason the layout guard above sits here.
      # WHY the absence is a visible SKIP: the script lives in the backend gitlink.
      - name: Module complexity ratchet
        working-directory: .
        run: |
          if [ ! -f backend/scripts/check_module_complexity.py ]; then
            echo "SKIP: backend/scripts/check_module_complexity.py is absent - the backend submodule was not checked out, so the size and complexity ratchet is unverified, not satisfied"
            exit 0
          fi
          python backend/scripts/check_module_complexity.py

      - name: Install ruff
        run: python -m pip install "ruff==0.14.1"

      # WHY ONLY THE FATAL SUBSET. The full rule set would fail on style debt that
      # predates this harness, and a gate that is red on day one is a gate everyone
      # learns to ignore - the failure R:\GPTHub\.github\workflows\ci.yml:41-51
      # describes (ruff was advisory until the debt was cleared in one commit).
      # These four rules are not style: E9 is a syntax/runtime error, F63/F7/F82
      # are comparisons, break/continue and undefined names - i.e. code that is
      # broken. Widening this selection is a follow-up, not a wish.
      #
      # The scope is `service`, the importable package. It was `src` before the
      # refactor; the old tree is deleted, and a step still linting src would
      # report "no files" and pass (measured: ruff exits 0 with a warning when the
      # path holds no Python). `backend/notebooks/`, `backend/tests/` and
      # `backend/data/` are outside the scope on purpose.
      # WHY there is no --exclude "*.ipynb" any more: ruff 0.15 DOES parse notebook
      # cells (measured: 7 F821 in the old backend/src/stuff/*.ipynb), and the flag
      # existed only because those cells contributed 7 of 18 findings. The
      # notebooks now live outside the package, so the flag has nothing to hide.
      # This command is IDENTICAL to the one in .pre-commit-config.yaml, so the two
      # gates cannot report different numbers.
      - name: Ruff (fatal rules only)
        run: ruff check --select E9,F63,F7,F82 service

      # THE IMPORT PROOF, and why it is a step of its own. The refactor's
      # strongest claim is that importing the app opens no MySQL connection and
      # pulls in no GPU framework (docs/ARCHITECTURE.md:229-232, ADR/0007).
      # Asserting that in a comment is how it decays: the first helpful
      # `import torch` at module scope, or a `pymysql.connect` evaluated while the
      # module is being imported, breaks the API image - and every existing check
      # still passes, because nothing imports the app in CI.
      #
      # WHAT IS PROVEN, and what is deliberately NOT:
      #   * an import of torch/torchvision/... at import time FAILS the step. The
      #     API image installs none of them (requirements.txt header), so this is
      #     the deployment fact, not a style preference.
      #   * pymysql.connect is replaced by a function that raises, so a connection
      #     opened while importing is caught. The DRIVER ITSELF stays importable on
      #     purpose: importing a driver opens no socket, and a check that forbade
      #     it would fail on a design nobody called wrong.
      #   * scripts/check_ml_boundary.py owns the static side of the same rule
      #     (module-scope ML imports anywhere under service/), so the two agree.
      - name: Import the app without torch and without opening MySQL
        run: |
          python - <<'PY'
          import importlib.abc
          import sys

          BLOCKED = ("torch", "torchvision", "torchaudio", "transformers",
                     "sentence_transformers", "moviepy", "librosa")


          class Blocker(importlib.abc.MetaPathFinder):
              """Refuses the ML stack, the way the API image does by omission."""

              def find_spec(self, name, path=None, target=None):
                  if name.split(".")[0] in BLOCKED:
                      raise ImportError("imported " + name + " while importing the app")
                  return None


          class Refuse:
              """Stands in for pymysql: any connection attempt is a failure."""

              @staticmethod
              def connect(*args, **kwargs):
                  raise RuntimeError("a MySQL connection was opened at import time")


          sys.meta_path.insert(0, Blocker())
          try:
              import pymysql
          except ImportError:
              pass
          else:
              pymysql.connect = Refuse.connect

          import service.api.app as app_module

          assert getattr(app_module, "app", None) is not None, "service.api.app exposes no app"
          print("service.api.app imported; no ML import, no MySQL connection")
          PY

      # The suite is the service's own contract; it does not need a database or a
      # GPU (docs/KNOWN_GAPS.md). `-q` keeps the log readable.
      #
      # WHY `python -m pytest -q` WITHOUT a path: tests/ grows SUBTREES
      # (fixtures/, integration/, snapshots/, vectors/, manual/), and an explicit
      # path argument both skips sibling directories a later commit adds and narrows
      # pytest's rootdir to the argument. With no argument pytest takes its rootdir
      # from the ini file / the invocation directory (backend/, the job's
      # working-directory), recurses into every test_*.py below it, and picks up new
      # directories with no workflow edit. Verified locally: 131 tests collected
      # from backend/ with the subtree layout, 0 from a single narrow directory.
      # WHY the `-d tests` guard is still there: pytest exits 4 (not 0) when the
      # argument does not exist, and a job that fails because a directory is absent
      # reports a missing file as a defect. The guard converts that into an explicit
      # SKIP - the directory is the contract, its absence is the gap.
      - name: Pytest
        run: |
          if [ ! -d tests ]; then
            echo "SKIP: backend/tests/ does not exist yet (docs/KNOWN_GAPS.md)"
            exit 0
          fi
          python -m pip install "pytest==8.2.2"
          python -m pytest -q

      # THE COVERAGE FLOOR, and why it is a gate rather than a badge. The suite
      # passed at 46% while every single application and persistence module sat at
      # zero: the routers answered, the business rules behind them were never
      # executed by a test, and nothing said so. A number that is only printed is
      # a number nobody protects; the floor is what turns it into a contract.
      #
      # WHY 90 AND WHY THE INTERPRETER DECIDES: this job measures 94.42% branch
      # coverage (Python 3.9 + requirements.txt only, so that is the number that counts);
      # the refactor venv on 3.10 measures 94.44% because a few stdlib-only branches
      # differ between the two pythons. The floor sits BELOW the measurement on purpose:
      # one point under the current number would turn every honest refactor - a branch
      # deleted, two helpers merged - into a demand for a new test, and a gate that has
      # to be negotiated is a gate people pass --no-verify. Far below it protects
      # nothing. Where the number came from: 46% when the suite first ran, 65 when the
      # gate landed (every application and persistence module still at zero), 73 with the
      # slice + deployment-module tests, 76 with the settings, schema-bootstrap, JWT,
      # entry-point, connection-recovery, composition and S3 tests, and 90 with the
      # router, task, mail, cache, storage, job-service and matching-pipeline contract
      # tests that took it to 94%. It gets raised in the same commit that adds the
      # coverage, and the number lives in backend/pyproject.toml
      # ([tool.coverage.report] fail_under) exactly once, so the Makefile target and this
      # step cannot drift.
      #
      # WHY 'coverage run' AND NOT 'pytest --cov': measured on this host, pytest-cov
      # resolves its configuration from .coveragerc by default, ignores
      # pyproject.toml, records STATEMENT data when it finds nothing, and a later
      # run that does read the branch setting then dies with "Can't combine
      # statement coverage data with branch data". The CLI has one entry point and
      # --rcfile makes the configuration explicit, so the number is a property of
      # the code instead of a property of which file got discovered.
      #
      # WHY branch = true at all: half of this tree's rules ARE the error branch -
      # a 404 that no test ever triggers is untested work that a line-coverage
      # number happily counts as covered.
      - name: Coverage floor (branch coverage of service/)
        run: |
          if [ ! -d tests ]; then
            echo "SKIP: backend/tests/ does not exist yet (docs/KNOWN_GAPS.md)"
            exit 0
          fi
          python -m pip install "coverage==7.16.2"
          python -m coverage run --branch --source=service --rcfile=pyproject.toml -m pytest -q
          python -m coverage report --rcfile=pyproject.toml

  # ===========================================================================
  # 4b. ML sidecar - the contract tests that must pass with no torch and no GPU.
  #
  # WHY this job can exist at all: R:\GPTHub runs its sidecars' test suites in CI
  # because each sidecar owns a small, dependency-light contract surface. The same
  # is true here only because ml/service/app.py defers every heavy import (torch,
  # torchvision, transformers, moviepy, ...) to the call that needs it, so the HTTP
  # layer is importable in a bare interpreter. If that ever stops being true, this
  # job fails and the regression is visible - which is exactly the property we want
  # to protect, not a reason to drop the job.
  #
  # WHY the pinned dependencies and not a requirements file: the ML stack is
  # multi-gigabyte and the CUDA wheels are unavailable on a runner. The contract
  # tests need the web layer and nothing else. test_contract.py asserts that torch
  # is NOT in sys.modules, so installing torch here would defeat the test.
  # ===========================================================================
  ml:
    name: ML sidecar (contract tests, no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 3.9 is what ml/docker/Dockerfile installs; the sidecar must be testable on
      # the same minor version the image runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # WHAT IS INSTALLED AND WHY IT IS EXACTLY THIS LIST. Four names, and each
      # one is here because a test fails without it - measured in a clean venv,
      # not assumed:
      #
      #   pytest            runs the suite.
      #   fastapi           the app under test. 0.111.0 is the version the
      #                     backend locks (backend/requirements.txt:45), so the
      #                     two services cannot drift into different Starlette
      #                     behaviour behind one HTTP contract.
      #   python-multipart  makes FastAPI 0.111 accept a Form(...) declaration at
      #                     all, and backs the multipart branch of
      #                     /v1/embed/video. Without it the app does not import.
      #   numpy             NOT optional, and easy to miss: ml/service/engine.py
      #                     imports text_embedding at MODULE scope, and that
      #                     module does `import numpy as np` at module scope
      #                     (ml/service/text_embedding.py:32). Omitting it fails
      #                     collection with ModuleNotFoundError: numpy before a
      #                     single test runs. The pin matches the image
      #                     (ml/docker/requirements.txt:30) so the array library
      #                     is the same one that will serve production.
      #
      # WHAT IS LEFT TO THE RESOLVER: pydantic, starlette, anyio and httpx.
      # They are dependencies OF fastapi (fastapi 0.111 declares httpx, and
      # starlette's TestClient speaks over it), so pinning them here by hand
      # would freeze a combination that pip never resolved together - the exact
      # trap backend/docker/requirements.lock.txt warns about. If fastapi's own
      # requirement is ever wrong, that is a fastapi bug and the pin above moves.
      #
      # WHAT IS DELIBERATELY ABSENT: torch, torchvision, torchaudio, transformers,
      # moviepy. Installing them would take tens of minutes, need CUDA wheels a
      # runner cannot use, and DEFEAT the suite: test_contract.py asserts torch is
      # not in sys.modules after importing the app. Their absence is the
      # precondition of the test, not a gap in it.
      - name: Install test dependencies
        run: >
          python -m pip install
          "pytest==8.2.2"
          "fastapi==0.111.0"
          "python-multipart==0.0.9"
          "numpy==1.26.4"

      # WHICH INVOCATION AND WHY. The sidecar owns its own import root, so CI
      # reads it from the submodule instead of hard-coding a directory:
      #
      #   (a) ml/pyproject.toml declares [tool.pytest.ini_options] pythonpath.
      #       Then the plain `python -m pytest ml/tests` below is enough: pytest
      #       infers rootdir from the path argument (ml/tests -> ml), reads that
      #       ini block, and the SAME declaration governs the developer's shell,
      #       `make ml-test` and this job. This is the preferred shape.
      #   (b) it does not (yet). Then this step exports PYTHONPATH for the module
      #       directory it can see - ml/service when the flat modules moved there,
      #       otherwise ml/ itself - and says which one it used.
      #
      # WHY not just hard-code PYTHONPATH=ml/service: the day the directory is
      # renamed, a hard-coded workflow keeps pointing at the old path, pytest
      # imports nothing, and the suite passes because it collected no tests. The
      # exported fallback is printed into the log for the same reason.
      #
      # WHY no tomllib: this job runs on 3.9, where it does not exist (3.11+). A
      # TOML parser dependency for one key would defeat the point of a job whose
      # value is that it installs almost nothing; the failure being guarded
      # against is an ABSENT key, which a regex catches.
      - name: Resolve the sidecar import root
        run: |
          python - <<'PY'
          import os, pathlib, re
          config = pathlib.Path('ml/pyproject.toml')
          declared = False
          if config.is_file():
              text = config.read_text(encoding='utf-8')
              match = re.search(r'^\[tool\.pytest\.ini_options\]\s*$((?:\n(?!\[|$).*)*)', text, re.M)
              declared = bool(match and re.search(r'^\s*pythonpath\s*=', match.group(1), re.M))
          if declared:
              print('sidecar import root: declared by ml/pyproject.toml pythonpath')
          else:
              for candidate in ('ml/service', 'ml'):
                  if any(pathlib.Path(candidate).glob('*.py')):
                      print('sidecar import root: no pyproject pythonpath, using ' + candidate)
                      with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
                          handle.write('PYTHONPATH=' + candidate + '\n')
                      break
              else:
                  raise SystemExit('no ml/*.py and no ml/service/*.py: the sidecar'
                                   ' checkout is missing or empty, so the contract'
                                   ' tests would collect nothing and pass')
          PY

      # The sidecar's OWN layout guard, before the tests. ml/service/ is a flat
      # directory of top-level modules BECAUSE the container imports them that way
      # (PYTHONPATH=/app/service, no package, no __init__.py); the day somebody adds
      # ml/service/core/helpers.py and a relative import, the image still builds and
      # the tests still pass while the documented contract in ml/README.md is gone.
      # The guard belongs to the submodule (it knows what "flat" means for its own
      # tree), is stdlib-only, and is named here rather than globbed so a rename is a
      # visible edit instead of a silently skipped step.
      # WHY absent is a visible SKIP: the file ships with ml/, so its absence means
      # the submodule was checked out without it - unverified, not satisfied.
      - name: Sidecar layout guard
        run: |
          if [ ! -f ml/scripts/check_ml_service_layout.py ]; then
            echo "SKIP: ml/scripts/check_ml_service_layout.py is absent - the ml submodule was not checked out, so the flat layout is unverified, not satisfied"
            exit 0
          fi
          python ml/scripts/check_ml_service_layout.py

      # The tests run from the repository ROOT, not from ml/. Two reasons, and the
      # first one is the load-bearing one: ml/pyproject.toml sets testpaths and
      # pythonpath, so pytest infers the same rootdir here as it does for
      # `make ml-test` and for a developer in the root - one invocation, three
      # callers. The second is that the gateway/health contract the suite asserts
      # is the one compose wires up from the root.
      #
      # ml/ imports NOTHING from backend/ (measured: `grep -rn 'sys.path' ml/service`
      # is empty and the modules import each other as bare top-level names), so
      # this job would still pass with backend/ absent. checkout uses
      # submodules: recursive because the OTHER jobs need it, not this one.
      - name: Contract tests
        run: python -m pytest ml/tests -q

  # ===========================================================================
  # 5. Frontend - the static bundle the nginx image serves.
  # ===========================================================================
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, never `npm install`: ci installs exactly the lock file and fails
      # if package.json and the lock disagree, which is the check we want
      # (R:\GPTHub\.github\workflows\ci.yml:177-178).
      - name: Install dependencies
        run: npm ci

      # WHY `npm run lint` AND NOT THE ESLINT COMMAND LINE: package.json owns one
      # definition of what linting this tree means (`eslint src --ext .js,.jsx`),
      # and the pre-commit hook runs that same script. Spelling the glob out here
      # would drift the first time a directory or an .mjs file is added, and the two
      # gates would then quietly check different files - the failure mode the fat
      # rule set taught us to avoid. `--no-install` is unnecessary: the script is
      # resolved from node_modules by npm itself, and `npm ci` above installed it.
      - name: ESLint
        run: npm run lint --silent

      # WHY A REACHABILITY CHECK AND NOT ONLY ESLINT: this tree is layered
      # pages -> features -> shared with absolute imports from `src/`, so a file can
      # be perfectly valid, pass every rule, and still be dead - the barrel
      # (features/<domain>/index.js) is the only thing that decides what is public,
      # and a module nothing imports is a module nothing tests. The script walks the
      # real import graph from src/index.js rather than grepping for the filename.
      # It is deliberately NOT part of `npm run build`: a build that fails on an
      # orphan file teaches people to delete the check, while a dedicated step names
      # the file that has no importer.
      - name: Unreachable modules
        run: npm run find:unreachable --silent

      # `--watchAll=false` because watch mode never exits on a runner. CI=true also
      # makes react-scripts treat warnings as errors in the build below, which is
      # the behavior we want a push gate to have.
      - name: Unit tests
        env:
          CI: "true"
        run: CI=true npm test -- --watchAll=false

      # The build IS the contract with the nginx image: if the bundle does not
      # compile, the frontend container ships a stale or broken build.
      - name: Production build
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
        run: npm run build

  # ===========================================================================
  # WHAT IS DELIBERATELY NOT HERE, and why.
  #
  # No image builds. GPTHub added them because `compose config -q` validates YAML,
  # not that a build context resolves, and a broken context shipped
  # (R:\GPTHub\.github\workflows\ci.yml:518-525). The same class of defect is
  # covered here by scripts/check_dockerfile_pins.py (base images pinned, no remote
  # ADD) plus the fact that both Dockerfiles copy from contexts this repository
  # controls. A full build would pull torch and a CUDA base - tens of minutes per
  # push for a check that `make build` performs locally before a deploy.
  # ===========================================================================
