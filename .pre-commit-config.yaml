# Pre-commit gates for the ML sidecar. Mirrors the shape of
# R:/GPTHub/whisper/.pre-commit-config.yaml so the submodules feel the same.
#
# WHY THE LOCAL HOOKS DO NOT USE `uv run --frozen` LIKE THE REFERENCE DOES: that form
# needs a committed uv.lock to be reproducible, and this submodule deliberately has
# none - its runtime dependencies are pinned against a CUDA wheel index in
# docker/requirements.txt, which uv does not resolve. A bare `ruff`/`pytest` is worse
# than either: on a developer machine with several checkouts it resolves to whichever
# virtualenv is active, so the hook silently checks another service. `python -m` at
# least ties the run to the interpreter the developer activated, and the exit code is
# the same as the one CI gets from ml/pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      # A file without a trailing newline produces a diff on every subsequent edit and
      # makes the Dockerfile/requirements pins irritating to review.
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # debug-statements catches a committed breakpoint()/pdb import. In a GPU
      # container that is not a slow test, it is a hung request.
      - id: debug-statements

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # WHY THE ENTRY POINTS ARE scripts/ml_gate.sh AND NOT `python -m ...`:
      # on Windows the name `python` on PATH is the Microsoft Store stub, which
      # starts no interpreter at all and exits 49. pre-commit reported both hooks
      # as "exit code: 9009" and refused every commit in this submodule. The
      # helper runs each candidate and keeps the first that both starts AND can
      # import the tool it is about to run (a uv-managed 3.12 with no ruff is not a
      # usable ruff interpreter, however healthy it looks). It probes after cd-ing
      # into the checkout, because this directory pins .python-version 3.9 and pyenv
      # shims here refuse to start on a machine without 3.9; the winner is then
      # resolved to its absolute path so a launcher cannot change its mind.
      # A machine with no Python at all gets a loud SKIP instead of a permanent
      # block; CI installs 3.9 with setup-python, so the gate still runs where it
      # can be trusted. README.md, "scripts/ml_gate.sh", has the full reasoning.
      #
      # NOTE ON WINDOWS: pre-commit resolves `bash` from PATH, and C:\WINDOWS\system32\bash.exe
      # is the WSL launcher - with no WSL distribution the failure reads
      # "execvpe(/bin/bash) failed". Put Git Bash first on PATH (or use `make lint`,
      # which pins SHELL); the superproject .pre-commit-config.yaml documents it too.
      - id: ml-ruff
        name: ruff (ml sidecar)
        entry: bash scripts/ml_gate.sh ruff check .
        language: system
        types: [python]
        pass_filenames: false
      - id: ml-pytest
        name: pytest (ml contract tests, no torch required)
        entry: bash scripts/ml_gate.sh pytest -q
        language: system
        types: [python]
        pass_filenames: false
        # The suite is the one gate that proves the HTTP contract still holds, so it runs
        # on every Python change rather than only when tests/ is touched.
        always_run: false
      - id: ml-layout
        name: layout guard (flat service/, entry imports, README routes)
        entry: bash scripts/ml_gate.sh layout
        language: system
        # No types filter: the properties it checks are about WHERE files are and what
        # README.md says, so a commit that only moves a file or edits the docs must run
        # it too.
        pass_filenames: false
        always_run: true
