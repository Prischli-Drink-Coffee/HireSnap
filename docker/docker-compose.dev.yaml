# ===========================================================================
# HireSnap - development compose stack (Compose project: hiresnap-dev).
#
# Entry point: ./docker/run.sh --dev. This file is STANDALONE, it is not merged
# onto docker-compose.yaml: run.sh passes exactly one -f. A merge would make
# "what is actually running" a question of two files and the load order, and the
# GPTHub stack it mirrors made the same choice (docker-compose.dev.yaml is a
# complete file there too).
#
# What differs from prod, and why:
#   * DEBUG=TRUE and INIT_DB=true come from .env.dev. DEBUG is not a preference:
#     server.py:1076-1081 raises on anything but TRUE/FALSE and gates uvicorn's
#     reload on it, and :1091-1094 is the ONLY place the schema is created.
#   * backend source is bind-mounted, so an edit restarts the reloader instead of
#     requiring a 10-minute image rebuild.
#   * backend:8080 and frontend:3000 are published, because dev tooling (curl,
#     the browser devtools, a local test runner) talks to them directly. Prod
#     publishes only the gateway.
#   * the frontend runs CRA's dev server (target: dev), not the static nginx
#     build, so REACT_APP_BASE_URL is a runtime variable here. It is baked in
#     prod; that asymmetry is CRA's, not ours.
# ===========================================================================
name: hiresnap-dev

# ---------------------------------------------------------------------------
# Shared fragments. Same pattern as the prod file: a mapping of the keys every
# backend-shaped container must receive, defined once.
#
# WHY it is duplicated instead of import-ed from docker-compose.yaml: these two
# files are standalone by design (run.sh passes exactly one -f). Compose has no
# include mechanism that keeps them settable independently, and generating one
# file from the other would make a hand edit to the generated file disappear on
# the next build. The vendored duplication is checked: scripts/check_compose_parity.py
# renders both files and compares service sets per profile, and
# scripts/check_env_parity.py compares the keys both files interpolate.
# ---------------------------------------------------------------------------
x-backend-env: &backend-env
  DB_HOST: ${DB__HOST:-mysql}
  DB_PORT: ${DB__PORT:-3306}
  DB_USER: ${DB__USER:?set DB__USER in docker/.env.dev}
  DB_PASSWORD: ${DB__PASSWORD:?set DB__PASSWORD in docker/.env.dev}
  DB: ${DB__NAME:-hiresnap}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
  DATA_PATH: ${DATA_PATH:-/app/data}
  # Platform layer (src/infra, src/workers, src/services/jobs_services.py).
  # Each of these is EMPTY or false by default in the manifest on purpose: the
  # flag section (CACHE/STORAGE/MAIL/CELERY=1) is what turns an OPTIONAL sidecar
  # on, and docker/sidecar_profiles.sh exports the wiring when it does. A key
  # with a value here would silently override that decision for every mode,
  # which is the failure mode this layout exists to avoid.
  #
  # The ml sidecar is not one of those flags - it is part of the stack in both
  # modes, which is why ML_SERVICE_URL below defaults to its DNS name.
  CACHE__BACKEND: ${CACHE__BACKEND:-memory}
  CACHE__REDIS_URL: ${CACHE__REDIS_URL:-redis://cache:6379/1}
  CACHE__PREFIX: ${CACHE__PREFIX:-hiresnap}
  CACHE__TTL: ${CACHE__TTL:-300}
  STORAGE__BACKEND: ${STORAGE__BACKEND:-local}
  # The sidecar's DNS name. NOT empty and NOT flag-derived: the API no longer
  # has an in-process inference path, so this is the only way it can produce an
  # embedding. Read per call, so pointing it somewhere else (a sidecar on
  # another host) needs no rebuild - only a container restart.
  ML_SERVICE_URL: ${ML__SERVICE_URL:-http://ml:8080}
  ML_SERVICE_CONNECT_TIMEOUT: ${ML__CONNECT_TIMEOUT:-10}
  ML_SERVICE_TIMEOUT: ${ML__TIMEOUT:-900}
  MAIL__ENABLED: ${MAIL__ENABLED:-false}
  MAIL__BACKEND: ${MAIL__BACKEND:-file}
  MAIL__HOST: ${MAIL__HOST:-}
  MAIL__PORT: ${MAIL__PORT:-}
  MAIL__FROM: ${MAIL__FROM:-no-reply@hiresnap.local}
  CELERY__ENABLED: ${CELERY__ENABLED:-false}
  CELERY__BROKER_URL: ${CELERY__BROKER_URL:-redis://cache:6379/1}
  CELERY__RESULT_BACKEND: ${CELERY__RESULT_BACKEND:-redis://cache:6379/1}

x-backend-volumes: &backend-volumes
  # Live source in dev: an edit restarts the reloader instead of costing a
  # 10-minute image rebuild. The two file mounts below win over the directory
  # mount for their subpaths because Compose orders mounts by target depth.
  - ../backend/src:/app/src
  - ../backend/env.py:/app/env.py:ro
  - ../backend/create_sql.py:/app/create_sql.py:ro
  - ../infra/storage:/app/data
  - ../infra/certs:/app/src/certs:ro
  # Weights, Cosmos tokenizer checkpoints and the HF cache are NOT mounted into
  # the API or the workers any more: they belong to the ml sidecar, which is the
  # only process that loads a model. Same reasoning as the prod file.
  - ../infra/logs:/app/logs

services:

  # --- MySQL 5.7 -----------------------------------------------------------
  mysql:
    profiles: ["dev"]
    image: mysql:5.7.44
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env.dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hiresnap}
      MYSQL_USER: ${MYSQL_USER:-hiresnap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in docker/.env.dev}
    # Same utf8mb4 reasoning as prod: 5.7 defaults to latin1 and the data is
    # Cyrillic, so a dev database on latin1 "works" until the first real string.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=64M
    volumes:
      # NAMED VOLUME for the same reason as prod (see docker-compose.yaml): a
      # Windows bind mount of an InnoDB datadir is a corruption and performance
      # hazard. It is a SEPARATE volume from the prod one, so a dev reset
      # (down -v) can never destroy the production database.
      - mysql_data_dev:/var/lib/mysql
      # Direct children only: mysql:5.7 runs the *.sh/*.sql files sitting
      # DIRECTLY in /docker-entrypoint-initdb.d and silently ignores
      # subdirectories, so mounting ../infra/mysql would mount a directory that
      # contains init/ and execute nothing.
      - ../infra/mysql/init:/docker-entrypoint-initdb.d:ro
      # The dump, at the path infra/mysql/init/00-init.sh probes first.
      - ../backend/HireSnap.sql:/opt/hiresnap/HireSnap.sql:ro
    # Runs ONLY on an empty datadir (first start). On an existing volume the
    # loader is a documented no-op - which is why a developer who edits the
    # schema sees nothing happen. Dev also runs CreateSQL() on boot because
    # INIT_DB=true, and that path is not a substitute: it writes .env relative
    # to the CWD, so the loader above stays the authoritative first-boot path.
    # See RUNBOOK.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: "always"
    networks:
      - internal

  # --- API -----------------------------------------------------------------
  backend:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: ./backend/docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - ./.env.dev
    environment:
      # Shared keys from the anchor above, plus the two that are dev-specific.
      <<: *backend-env
      INIT_DB: ${INIT_DB:-true}
      # uvicorn's reloader watches the working directory; CRA-style polling is
      # not needed for Python, but a bind mount on Windows/macOS does not always
      # deliver inotify events. Force polling ONLY in dev - in prod it would
      # burn CPU scanning a static tree.
      WATCHFILES_FORCE_POLLING: "true"
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        # service_started, same reasoning as prod: a cold sidecar must not hold
        # the API host. In dev the sidecar is REPLACED by an image whose code is
        # bind-mounted, so a 200 on /health is not a useful precondition for an
        # API that only needs the DNS name to exist.
        condition: service_started
    ports:
      # DEV ONLY. Prod reaches the API through the gateway and publishes nothing.
      - "${BACKEND_PUBLISH_PORT:-8080}:8080"
    volumes: *backend-volumes
    healthcheck:
      # Same probe as prod, but a far shorter start_period: the dev image has
      # the same dependencies, yet a developer waiting two minutes for "healthy"
      # on a cached image is a bug report waiting to happen.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVER_PORT}/server/openapi.json -o /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: "always"
    # Same reasoning as prod: an in-flight inference must not be SIGKILLed.
    stop_grace_period: 30s
    networks:
      - default
      - internal

  # --- SPA (CRA dev server) ------------------------------------------------
  frontend:
    profiles: ["dev"]
    build:
      context: ../frontend
      dockerfile: ./docker/Dockerfile
      target: dev
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      # Works ONLY here: CRA's dev server reads the environment when it starts,
      # so a runtime value is honoured. In prod the same variable must be a
      # build ARG, because the bundle is already compiled (see the prod file).
      REACT_APP_BASE_URL: ${REACT_APP_BASE_URL:-http://localhost:8080/api/}
      # Runtime here, build ARG in prod: CRA recompiles on demand in the dev
      # server, so process.env is still readable. Empty is a valid value - the
      # requisites form then offers no suggestions.
      REACT_APP_DADATA_TOKEN: ${DADATA_TOKEN:-}
      # Polling watcher: bind mounts on Windows and macOS do not deliver inotify
      # events, so without this the dev server never rebuilds on a file change.
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: "3000"
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PUBLISH_PORT:-3000}:3000"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      # node_modules stays in the image: mounting the host's copy would shadow
      # it with binaries built for the host platform.
    healthcheck:
      # CRA compiles on first request; a TCP-level answer from the dev server is
      # the honest signal, and wget is in the alpine base.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: "always"
    networks:
      - default

  # --- Gateway -------------------------------------------------------------
  gateway:
    profiles: ["dev"]
    image: nginx:1.27-bookworm
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      NGINX_PORT: "80"
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infra/nginx/templates:/etc/nginx/templates:ro
      - ../infra/nginx/certs:/etc/nginx/certs:ro
      - ../infra/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Same ports as prod on purpose: the URLs printed by run.sh and copied
      # into tickets must work in both modes, and a dev-only port number is a
      # difference nobody remembers.
      - "${NGINX_PUBLISH_HTTP:-8088}:80"
      - "${NGINX_PUBLISH_HTTPS:-8443}:443"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: "always"
    networks:
      - default
      - internal

  # --- Optional sidecars (same flags, same profile names) ------------------
  cache:
    profiles: ["cache"]
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "always"
    networks:
      - internal

  storage:
    profiles: ["storage"]
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE__ACCESS_KEY:?set STORAGE__ACCESS_KEY in docker/.env.dev}
      MINIO_ROOT_PASSWORD: ${STORAGE__SECRET_KEY:?set STORAGE__SECRET_KEY in docker/.env.dev}
    volumes:
      - minio_data_dev:/data
    ports:
      # In dev the console (9001) is published so the bucket layout can be
      # inspected in a browser; the API port is not, because nothing uses it yet
      # and publishing every port "just in case" is how a stack becomes a
      # security review item.
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: "always"
    networks:
      - internal

  # --- ML sidecar ----------------------------------------------------------
  # A CORE dev service, exactly as in prod: the API has no in-process inference
  # path, so a dev stack without it can serve screens but cannot embed anything.
  #
  # The dev difference is MOUNT POLICY, not topology. ml/service/ - the whole
  # sidecar, app, engine, settings and the vendored cosmos_tokenizer - is
  # bind-mounted read-only over the copy baked into the image, so a code edit
  # takes effect on the next request instead of the next image build. That is
  # the same trick the backend uses for its own source, and it is why this file
  # can exist at all: a 4 GB CUDA image that must be rebuilt to change one line
  # is not a development loop.
  #
  # Note what is NOT mounted any more: the sidecar used to import the pipeline
  # out of backend/src, so this block carried a second bind mount into another
  # submodule. It now imports its own copy from /app/service, which means a
  # backend edit cannot break a dev sidecar and the mount list describes one
  # submodule instead of two.
  ml:
    profiles: ["dev"]
    build:
      # Same context as prod and for the same reason: the image is built from
      # the submodule that owns the code (ml/service/ + ml/docker/), so a dev
      # build and a prod build see an identical set of inputs. A context that
      # differed between the two files would be a defect that only shows up in
      # the environment nobody rebuilds.
      context: ../ml
      dockerfile: docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - ./.env.dev
    environment:
      ML_HOST: ${ML__HOST:-0.0.0.0}
      ML_PORT: ${ML__PORT:-8080}
      # Same split as prod: the manifest carries the flat sidecar settings
      # under an ML_ prefix, this block is the one translation point. The four
      # path keys are LITERALS for the same reason as in prod - they are mount
      # targets inside this container, not host paths - and they name the
      # directories ml/docker/Dockerfile creates.
      DATA_PATH: /app/ml-scratch
      WEIGHTS_DIR: /app/models/weights
      PRETRAINED_CKPT_DIR: /app/models/pretrained_ckpts
      HF_HOME: /app/.cache/huggingface
      DEVICE: ${ML_DEVICE:-}
      MAX_UPLOAD_MB: ${ML_MAX_UPLOAD_MB:-512}
      MAX_TEXT_CHARS: ${ML_MAX_TEXT_CHARS:-20000}
      MODEL_IDLE_UNLOAD_SECONDS: ${ML_MODEL_IDLE_UNLOAD_SECONDS:-0}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    init: true
    volumes:
      # /app/service is the sidecar's OWN code AND the pipeline it runs: since
      # the split, both live in ml/service/ (PYTHONPATH=/app/service, flat
      # imports), so one mount covers what used to take two. Read-only: a
      # container that can write to the repository is a container that can lose
      # a developer's work on a bad run.
      - ../ml/service:/app/service:ro
      # Host side from the manifest, container side fixed by settings.py, same
      # as prod: the two files must describe identical container paths or a bug
      # reproduces in exactly one of them.
      - ${WEIGHTS_DIR:-../infra/models/weights}:/app/models/weights:ro
      - ${PRETRAINED_CKPT_DIR:-../infra/models/pretrained_ckpts}:/app/models/pretrained_ckpts:ro
      - ../infra/logs:/app/logs
      - ml_scratch_dev:/app/ml-scratch
      - hf_cache_dev:/app/.cache/huggingface
    # NO published port, not even in dev. The contract is that the sidecar is
    # reachable only from inside the compose project; a developer who wants to
    # poke it uses './docker/run.sh --dev exec ml sh' or points curl at the
    # container from another service. Publishing it would put an
    # unauthenticated inference API on the host's network for the convenience of
    # one command, and dev machines are exactly the ones that get moved onto a
    # shared network.
    #
    # NO GPU reservation either: it lives in docker-compose.gpu.yaml and run.sh
    # applies it when GPU=1. A developer without a card gets a working, slow,
    # CPU-only sidecar instead of a container that refuses to start.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${ML__PORT:-8080}/health -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The same 300 s as prod, for the same reason: this is not slack for a
      # slow bind mount (that is a few seconds), it is the first start, which
      # downloads the HF text/ASR weights into hf_cache_dev before /health can
      # turn green. A shorter value would make a healthy first start look like a
      # crash loop in dev - the one place where images are NOT pre-warmed.
      start_period: 300s
    restart: "always"
    stop_grace_period: 30s
    networks:
      - default
      - internal


  # --- Optional: celery workers (profile celery, CELERY=1) -----------------
  # Identical topology to prod. Dev gets the queues as well because the whole
  # point of the split is to find out BEFORE deployment that a task routes to a
  # queue nobody consumes: with only a beat and no worker, a scheduled task
  # succeeds from the caller's point of view and silently never runs.
  celery-worker-agents:
    profiles: ["celery"]
    build:
      context: ..
      dockerfile: ./backend/docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - ./.env.dev
    environment:
      <<: *backend-env
      INIT_DB: "false"
      # A worker must never create or patch the schema: several of them starting
      # at once would race the dump replay and each other.
      CELERY__ENABLED: "true"
      WATCHFILES_FORCE_POLLING: "true"
    command: ["celery", "-A", "src.workers.celery_app", "worker",
              "--queues=agents", "--loglevel=info",
              "--concurrency=${CELERY_AGENTS_CONCURRENCY:-1}"]
    init: true
    depends_on:
      cache:
        condition: service_healthy
      # Same as prod: the worker posts to the sidecar, so the container must
      # exist first. service_started, not service_healthy - a worker waiting on a
      # cold sidecar would hold the queue for minutes for no benefit.
      ml:
        condition: service_started
    volumes: *backend-volumes
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.workers.celery_app inspect ping -d celery@$${HOSTNAME} --timeout 10 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: "always"
    stop_grace_period: 360s
    networks:
      - internal

  celery-worker-maintenance:
    profiles: ["celery"]
    build:
      context: ..
      dockerfile: ./backend/docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - ./.env.dev
    environment:
      <<: *backend-env
      INIT_DB: "false"
      CELERY__ENABLED: "true"
      WATCHFILES_FORCE_POLLING: "true"
    command: ["celery", "-A", "src.workers.celery_app", "worker",
              "--queues=maintenance", "--loglevel=info",
              "--concurrency=${CELERY_MAINTENANCE_CONCURRENCY:-1}"]
    init: true
    depends_on:
      cache:
        condition: service_healthy
      # Same as prod: the worker posts to the sidecar, so the container must
      # exist first. service_started, not service_healthy - a worker waiting on a
      # cold sidecar would hold the queue for minutes for no benefit.
      ml:
        condition: service_started
    volumes: *backend-volumes
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.workers.celery_app inspect ping -d celery@$${HOSTNAME} --timeout 10 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: "always"
    stop_grace_period: 360s
    networks:
      - internal

  celery-worker-ml:
    profiles: ["celery"]
    build:
      context: ..
      dockerfile: ./backend/docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - ./.env.dev
    environment:
      <<: *backend-env
      INIT_DB: "false"
      CELERY__ENABLED: "true"
      WATCHFILES_FORCE_POLLING: "true"
    command: ["celery", "-A", "src.workers.celery_app", "worker",
              "--queues=ml", "--loglevel=info",
              "--concurrency=${CELERY_ML_CONCURRENCY:-1}"]
    init: true
    depends_on:
      cache:
        condition: service_healthy
      # Same as prod: the worker posts to the sidecar, so the container must
      # exist first. service_started, not service_healthy - a worker waiting on a
      # cold sidecar would hold the queue for minutes for no benefit.
      ml:
        condition: service_started
    volumes: *backend-volumes
    # No GPU reservation: this worker only decides WHAT to embed and posts the
    # bytes to the sidecar. The card is reserved on ml (docker-compose.gpu.yaml).
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.workers.celery_app inspect ping -d celery@$${HOSTNAME} --timeout 10 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: "always"
    stop_grace_period: 1860s
    networks:
      - internal

  celery-beat:
    profiles: ["celery"]
    build:
      context: ..
      dockerfile: ./backend/docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - ./.env.dev
    environment:
      <<: *backend-env
      INIT_DB: "false"
      CELERY__ENABLED: "true"
    command: ["celery", "-A", "src.workers.celery_app", "beat", "--loglevel=info",
              "--pidfile=/tmp/celerybeat.pid", "--schedule=/tmp/celerybeat-schedule"]
    init: true
    depends_on:
      cache:
        condition: service_healthy
      # Same as prod: the worker posts to the sidecar, so the container must
      # exist first. service_started, not service_healthy - a worker waiting on a
      # cold sidecar would hold the queue for minutes for no benefit.
      ml:
        condition: service_started
    volumes: *backend-volumes
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 \"$$(cat /tmp/celerybeat.pid)\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: "always"
    stop_grace_period: 60s
    networks:
      - internal

  # --- Optional: mail catcher (profile mail, MAIL=1) -----------------------
  # Dev publishes the web inbox on 8025 so the reset link can be clicked in a
  # browser. Prod publishes nothing: a mail catcher on the public ingress is a
  # data leak with an HTTP interface.
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.20.5
    environment:
      MP_MAX_MESSAGES: ${MP_MAX_MESSAGES:-5000}
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      TZ: UTC
    ports:
      - "${MAILPIT_PUBLISH_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: "always"
    networks:
      - internal

# Dev volumes are separate from prod's on purpose: a schema experiment in dev
# must not be able to touch the production database, and "down -v" while
# developing must not delete it either.
volumes:
  mysql_data_dev:
  redis_data_dev:
  minio_data_dev:
  # The sidecar's request scratch space. Separate from prod's on the same rule
  # as every other volume here: a dev experiment must not touch prod state.
  ml_scratch_dev:
  hf_cache_dev:

networks:
  default:
    driver: bridge
  # internal has no egress even in dev: the point of running the same topology
  # locally is to find out early that a service needs the internet.
  internal:
    driver: bridge
    internal: true
