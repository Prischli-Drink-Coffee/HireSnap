# ===========================================================================
# HireSnap SPA - nginx config INSIDE the frontend container.
# ===========================================================================
#
# Copied to /etc/nginx/conf.d/default.conf by frontend/docker/Dockerfile:110.
# This is NOT the gateway config (that one is infra/nginx/nginx.conf plus
# infra/nginx/templates/site.conf.template). The division of labour:
#   * the gateway is the only published entry point and owns /api/, /data/,
#     security headers, rate limiting and TLS;
#   * this file only serves static files and owns the SPA fallback.
# Mixing the two is how a stack ends up with two sources of truth for /api/.
#
# Mirror of R:\GPTHub\frontend\nginx.conf:1-63 (same file, same job, same
# cache policy), with the gateway's cache rules repeated here because the
# gateway proxies to this server: whichever process answers, the headers must
# be the same.
# ===========================================================================

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hide the nginx version: the frontend container is reachable from the
  # gateway's network, and a version string is a free fingerprint.
  server_tokens off;

  # ---- gzip ---------------------------------------------------------------
  # Text types only. Compressing mp4/jpg/png wastes CPU on bytes that are
  # already compressed; the bundle is JS/CSS/JSON and that is what pays off.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/atom+xml
    image/svg+xml
    font/woff
    font/woff2;
  # gzip_static serves a precompressed .gz when one exists and falls back to
  # on-the-fly compression otherwise. Free when no .gz is shipped.
  gzip_static on;

  # ---- security headers ---------------------------------------------------
  # Repeated from the gateway on purpose: nginx does not merge add_header
  # between levels, and this server renders error pages of its own (404s for
  # missing assets) that never touch the gateway's add_headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  # No Content-Security-Policy here. GPTHub's config (frontend/nginx.conf:42)
  # ships one with 'unsafe-inline' and 'unsafe-eval', i.e. a policy that
  # permits exactly what it is supposed to prevent. HireSnap has no CSP at all
  # yet; adding an honest one requires knowing every third-party origin the SPA
  # calls (Chakra loads nothing, but tesseract.js downloads worker WASM).
  # That belongs to a change that can test it, not to the docker layer.

  # ---- health -------------------------------------------------------------
  # Answered here, never proxied: the SPA container must report healthy while
  # the API is restarting. compose healthcheck and run.sh poll this.
  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"frontend"}';
  }

  # ---- cache policy -------------------------------------------------------
  # CRA emits content-hashed filenames (main.4f3a1c.js), so a one-year
  # immutable cache is safe: a new build produces a NEW filename, and the HTML
  # that references it is never cached (next block). Mirror of
  # R:\GPTHub\frontend\nginx.conf:44-49.
  # 'try_files $uri =404' instead of falling through to the SPA: a missing
  # asset must be a 404, not index.html with a 200 - otherwise a broken bundle
  # surfaces as 'Unexpected token <' in the console instead of a network error.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
    access_log off;
  }

  # HTML must never be cached, or a redeploy leaves browsers pointing at asset
  # filenames that no longer exist. Mirror of R:\GPTHub\frontend\nginx.conf:51-57.
  # NOTE: index.html is served through this regex only when requested by name;
  # the SPA fallback below serves it for client routes and sets the same
  # headers, because add_header in one location does not apply to another.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri /index.html;
  }

  # ---- SPA fallback -------------------------------------------------------
  # Every unknown path is a client-side route (react-router), so it must return
  # the app shell rather than 404. The no-cache headers are repeated because
  # this is the location that actually serves index.html for a deep link.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  # ---- errors -------------------------------------------------------------
  # Default nginx error pages are HTML; the SPA fetches JSON and would show a
  # parse error. Only 5xx is rendered as JSON here - a 404 for a genuinely
  # missing static file should look like a 404.
  error_page 500 502 503 504 /50x.json;
  location = /50x.json {
    internal;
    default_type application/json;
    add_header Retry-After 30 always;
    return 503 '{"error":"service_unavailable","status":503}';
  }
}
