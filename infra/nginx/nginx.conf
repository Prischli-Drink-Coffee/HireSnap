# HireSnap gateway - global nginx configuration.
#
# Mounted read-only at /etc/nginx/nginx.conf by the gateway service in
# docker/docker-compose.yaml (host path ../infra/nginx/nginx.conf, the same
# wiring as R:\GPTHub\docker\docker-compose.yaml:154).
#
# WHY every non-obvious line is here rather than in a vhost: this file is the
# only place that survives a vhost swap. Anything that must hold for every
# server block lives here so a new template cannot silently drop it.

worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Hide the nginx version in the Server header and on error pages: an exact
    # version string is a free fingerprint for exploit matching. Mirror of
    # R:\GPTHub\infra\nginx\nginx.conf:9.
    server_tokens off;

    # Docker embedded DNS. The vhost template proxies to VARIABLES
    # ($backend_upstream, $frontend_upstream) rather than to literal host names,
    # and nginx only resolves variables through a resolver at request time.
    # Without this directive a variable upstream fails with
    # "no resolver defined to resolve backend".
    # valid=10s bounds how stale a re-created container's IP can be - the reason
    # the variable form exists at all (GPTHub nginx.conf:11-13 and
    # templates/site.conf.template:30-33).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # WebSocket upgrade map. A client that sends no Upgrade header must get
    # "close", not "upgrade", otherwise every plain HTTP request through a
    # proxied location would carry a bogus Connection: upgrade.
    # Mirror of R:\GPTHub\infra\nginx\nginx.conf:15-19.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # $request_id is generated by nginx per request and echoed back by the
    # backend (proxy_set_header X-Request-ID below), so one log line here can be
    # joined with the backend's own log line for the same request.
    # Mirror of R:\GPTHub\infra\nginx\nginx.conf:21-23.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" "$request_id" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

    # Containers have no log collector: stdout is the only sink that
    # `docker logs` and the compose log driver can read. Writing to a file
    # inside the container would lose the log on re-create.
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nodelay     on;
    tcp_nopush      on;

    # 500m instead of GPTHub's 200m (R:\GPTHub\infra\nginx\nginx.conf:30):
    # HireSnap's primary input is an uploaded VIDEO to
    # /api/upload_video/inference/{user_id}
    # (backend/service/services/matching/presentation/routers/inference_api/inference_api.py),
    # and nginx answers 413 before the request ever reaches FastAPI when this is
    # exceeded. Video is ten times heavier than GPTHub's document uploads, so the
    # limit is raised at the edge; the application's own limit stays its check.
    client_max_body_size 500m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;

    # gzip: compress the text types the SPA and the JSON API actually emit.
    # Compressing images/video (mp4, jpg, png) wastes CPU - they are already
    # compressed - which is why they are absent from gzip_types.
    # Mirror of R:\GPTHub\infra\nginx\nginx.conf:35-45.
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/manifest+json
        image/svg+xml;

    # Default security headers. NOTE: nginx does not MERGE add_header between
    # levels - a server/location block that declares any add_header discards
    # every inherited one. The vhost template therefore re-declares these in the
    # server block; these copies cover the blocks that declare none (e.g. the
    # conf.d placeholder).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-ID $request_id always;

    # Proxy defaults inherited by every location that does not override them.
    proxy_redirect off;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-ID      $request_id;

    # Long-poll / inference endpoints can run for minutes (video embedding);
    # resetting the connection at nginx's 60s default would surface as a
    # spurious 504 while the backend keeps working.
    proxy_connect_timeout 7s;
    proxy_send_timeout    86400s;
    proxy_read_timeout    86400s;

    # Site templates. The nginx image runs envsubst over /etc/nginx/templates
    # into /etc/nginx/conf.d at container start (mounted by compose, mirror of
    # R:\GPTHub\docker\docker-compose.yaml:155), so site.conf is generated,
    # never committed. conf.d/default.conf keeps the image's stock default server
    # out of the way - otherwise it would answer :80 for unknown Host headers and
    # shadow the real vhost.
    include conf.d/*.conf;
}
