# Placeholder that overrides the nginx image's stock /etc/nginx/conf.d/default.conf.
#
# WHY an empty file is mounted over it: the official image ships a default server
# listening on :80 that answers every unmatched Host with the "Welcome to nginx"
# page. Left in place it competes with the site vhost generated from
# infra/nginx/templates/site.conf.template, and depending on load order it can
# win the default_server binding. Replacing it with this comment removes the
# server without removing the include (http { include conf.d/*.conf; }).
# Mirror of R:\GPTHub\infra\nginx\conf.d\default.conf.
#
# Do not add a server block here: per-site configuration belongs in
# templates/site.conf.template, which is rendered with APP_DOMAIN at start.
